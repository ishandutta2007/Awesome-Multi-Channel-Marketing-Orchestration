<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes flowLine {
      from { stroke-dashoffset: 160; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillRev {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes shimmer {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .bg-grid { fill: url(#grid); }
    .pulse-glow-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulse-glow-2 {
      animation: pulseOrb 10s ease-in-out infinite 3s;
      transform-origin: 1000px 260px;
    }
    .flowing-path {
      stroke-dasharray: 12 12;
      animation: flowLine 4s linear infinite;
    }
    .flowing-path-fast {
      stroke-dasharray: 8 8;
      animation: flowLine 2.5s linear infinite;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPillRev 6s ease-in-out infinite 0.8s; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 1.5s; }
    .pill-4 { animation: floatPillRev 6.5s ease-in-out infinite 2.2s; }
    .pill-5 { animation: floatPill 4.8s ease-in-out infinite 3s; }
    .star-shimmer { animation: shimmer 3s ease-in-out infinite; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" class="bg-grid"/>

  <!-- Ambient Pulsing Glow Orbs in Background -->
  <circle cx="220" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" class="pulse-glow-1"/>
  <circle cx="980" cy="270" r="160" fill="#a855f7" filter="url(#glow)" class="pulse-glow-2"/>
  <circle cx="600" cy="180" r="180" fill="#4f46e5" filter="url(#glow)" opacity="0.15"/>

  <!-- Background Dynamic Channel Workflow / Data Flow Paths (Behind Foreground Text) -->
  <g opacity="0.45">
    <!-- Top journey curve -->
    <path d="M -50 70 C 300 10, 500 130, 800 50 S 1100 120, 1250 60" fill="none" stroke="#38bdf8" stroke-width="2" class="flowing-path"/>
    <!-- Central connection loops -->
    <path d="M -50 280 C 250 290, 450 210, 750 310 S 1050 230, 1250 290" fill="none" stroke="#818cf8" stroke-width="2" class="flowing-path-fast"/>
    <!-- Connecting vertical data drops -->
    <line x1="240" y1="70" x2="240" y2="290" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="960" y1="60" x2="960" y2="280" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Animated Multi-Channel Badges (Top & Bottom Bands, strictly framed around text) -->
  <!-- Top Channel Badges -->
  <g class="pill-1" transform="translate(140, 40)">
    <rect width="110" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow-subtle)"/>
    <text x="55" y="21" font-size="12" font-weight="600" fill="#e0f2fe" text-anchor="middle">✉️ Email</text>
  </g>

  <g class="pill-2" transform="translate(390, 32)">
    <rect width="115" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="#22c55e" stroke-width="1.2" filter="url(#glow-subtle)"/>
    <text x="57" y="21" font-size="12" font-weight="600" fill="#dcfce7" text-anchor="middle">💬 WhatsApp</text>
  </g>

  <g class="pill-3" transform="translate(670, 35)">
    <rect width="100" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="#f59e0b" stroke-width="1.2" filter="url(#glow-subtle)"/>
    <text x="50" y="21" font-size="12" font-weight="600" fill="#fef3c7" text-anchor="middle">🔔 Push</text>
  </g>

  <g class="pill-4" transform="translate(930, 40)">
    <rect width="115" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="#ec4899" stroke-width="1.2" filter="url(#glow-subtle)"/>
    <text x="57" y="21" font-size="12" font-weight="600" fill="#fce7f3" text-anchor="middle">📱 SMS / RCS</text>
  </g>

  <!-- Bottom Channel Badges -->
  <g class="pill-5" transform="translate(220, 290)">
    <rect width="135" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="#a855f7" stroke-width="1.2" filter="url(#glow-subtle)"/>
    <text x="67" y="21" font-size="12" font-weight="600" fill="#f3e8ff" text-anchor="middle">⚡ Journey Flow</text>
  </g>

  <g class="pill-2" transform="translate(520, 295)">
    <rect width="145" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-subtle)"/>
    <text x="72" y="21" font-size="12" font-weight="600" fill="#cffafe" text-anchor="middle">🎯 Dynamic Audience</text>
  </g>

  <g class="pill-1" transform="translate(830, 290)">
    <rect width="145" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="#6366f1" stroke-width="1.2" filter="url(#glow-subtle)"/>
    <text x="72" y="21" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">🤖 AI Orchestration</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Key Pill (Clean & Unobscured) -->
  <g id="foreground-content">
    <!-- Category Pill Tag -->
    <rect x="460" y="98" width="280" height="26" rx="13" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1"/>
    <text x="600" y="115" font-size="11" font-weight="700" letter-spacing="1.5" fill="#a5b4fc" text-anchor="middle">ENTERPRISE SAAS &amp; OPEN SOURCE</text>

    <!-- Main Title -->
    <text x="600" y="165" font-size="38" font-weight="900" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="-0.5" filter="url(#glow-subtle)">Awesome Multi-Channel Marketing Orchestration</text>

    <!-- Subtitle & Value Proposition -->
    <text x="600" y="202" font-size="15" font-weight="400" fill="#cbd5e1" text-anchor="middle">
      Curated cross-channel customer journeys, automated lifecycle messaging &amp; engagement engines
    </text>

    <!-- Supporting Features Line -->
    <text x="600" y="232" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" class="star-shimmer">
      🚀 Enterprise Giants &bull; 🛡️ Privacy &amp; Data Sovereignty &bull; 📦 Self-Hosted Solutions &bull; 🤖 Agentic AI Triggers
    </text>
  </g>
</svg>
